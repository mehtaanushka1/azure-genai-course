name: GenAI Evaluation Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Microsoft evaluation code
        uses: actions/checkout@v4
        with:
          repository: microsoft/ai-agent-evals
          ref: v3-beta
          path: .evaluation-action

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evaluation dependencies
        run: python -m pip install ./.evaluation-action

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Foundry Evaluation
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          DEPLOYMENT_NAME: ${{ vars.EVALUATION_MODEL }}
          AGENT_IDS: ${{ vars.FOUNDRY_AGENT_ID }}
          DATA_PATH: ${{ github.workspace }}/data/evaluation.json
        run: |
          python - <<'PY'
          import json
          import runpy
          import sys
          from pathlib import Path

          source = Path(".evaluation-action").resolve()
          sys.path.insert(0, str(source))
          import analysis

          original = analysis.process_evaluation_results

          def capture_results(*args, **kwargs):
              results = original(*args, **kwargs)
              scores = {
                  name: score.result_items
                  for name, score in results["evaluation_scores"].items()
              }
              Path("outputs").mkdir(exist_ok=True)
              Path("outputs/evaluation-results.json").write_text(
                  json.dumps(scores, indent=2), encoding="utf-8"
              )
              return results

          analysis.process_evaluation_results = capture_results
          runpy.run_path(str(source / "action.py"), run_name="__main__")
          PY

      - name: Enforce 85 percent task-adherence gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(
              Path("outputs/evaluation-results.json").read_text()
          )
          rows = results.get("builtin.task_adherence", [])
          expected = len(json.loads(
              Path("data/evaluation.json").read_text()
          )["data"])

          if not rows or len(rows) != expected:
              raise SystemExit("QUALITY GATE: ERROR - incomplete results")
          if any(type(row.get("passed")) is not bool for row in rows):
              raise SystemExit("QUALITY GATE: ERROR - invalid pass indicators")

          passed = sum(row["passed"] for row in rows)
          rate = passed / len(rows)
          success = rate >= 0.85
          status = "PASS" if success else "FAIL"
          message = (
              f"Task-adherence passing rate: {rate:.1%} "
              f"({passed}/{len(rows)}); threshold: 85.0%\n"
              f"QUALITY GATE: {status}"
          )
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Quality gate\n\n" + message + "\n")
          raise SystemExit(0 if success else 1)
          PY

      - name: Save evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-evaluation-results
          path: outputs/evaluation-results.json
          if-no-files-found: warn
